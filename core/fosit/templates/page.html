// ------------------------------------------------------------------ results: is it worth it?
function worthCard() {
  const kpi = D.kpi;
  const key = String(D.decision_level);
  const cells = D.cells.filter((c) => c.spend > 0 && c.kpis[kpi]);
  if (!cells.length) return card("Is it worth the money?", null, el("p", { class: "muted" }, "Add the spend file to see the cost of one extra order and if the ads pay off."));
  const orders = kpi === "orders";
  const ivOf = (c) => (c.kpis[kpi].intervals[key] || {})[orders ? "icpa" : "iroas"] || [null, null];
  const real = (c) => ((c.kpis[kpi].intervals[key] || {}).incremental || [0])[0] > 0;   // a point cost only means something when the effect is clear of zero
  const pts = cells.filter(real).map((c) => c.kpis[kpi][orders ? "icpa" : "iroas"]).filter(fin);
  const target = orders ? D.decision.target_icpa : D.decision.breakeven_iroas;
  const ends0 = cells.flatMap((c) => ivOf(c)).filter((x) => fin(x) && x > 0);
  const base = fin(target) ? target : pts.length ? Math.max(...pts) : ends0.length ? Math.min(...ends0) : orders ? cells[0].spend / Math.max(1, cells[0].kpis[kpi].counterfactual * 0.05) : 1;
  const ends = cells.flatMap((c) => ivOf(c)).filter((x) => fin(x) && x > 0);
  const lo = Math.min(base, ...ends) / 3, hi = Math.max(base, ...ends.filter((x) => x < base * 20)) * 2;
  const toV = (t) => snap(lo * Math.pow(hi / lo, t / 1000));
  const toT = (v) => Math.round(1000 * Math.log(v / lo) / Math.log(hi / lo));
  const start = fin(target) ? target : nice(base * 1.2);
  const input = el("input", { type: "range", min: 0, max: 1000, value: toT(start), id: "worth", "aria-describedby": "worth-val" });
  const val = el("div", { class: "val", id: "worth-val" });
  const rows = el("div", {});
  const axisMax = Math.max(hi, ...cells.map((c) => ivOf(c)[1] || 0).filter(fin));
  const pos = (x) => Math.max(0, Math.min(100, 100 * Math.log(Math.max(x, lo) / lo) / Math.log(axisMax / lo)));
  function draw() {
    const v = toV(Number(input.value));
    val.textContent = orders ? money(v) + " per extra order" : ratio(v) + " " + cur + " back per 1 " + cur + " spent";
    rows.replaceChildren(...cells.map((c, i) => {
      const [a, b] = ivOf(c);
      const m = c.kpis[kpi];
      let say, tone;
      const fitBad = c.verdict === "inconclusive" && m.pre_fit_limit != null && m.pre_fit_nrmse > m.pre_fit_limit;
      if (fitBad) { say = "The fit check failed, so the test gives no answer."; tone = "neutral"; }
      else if (orders) {
        if (b != null && b <= v) { say = `Even the high end (${money(b)}) is below ${money(v)}.`; tone = "good"; }
        else if (a != null && a > v) { say = `Even the low end (${money(a)}) is above ${money(v)}.`; tone = "bad"; }
        else { say = `One extra order costs ${span([a, b], money)}. Your value is inside this range.`; tone = "neutral"; }
      } else {
        if (a != null && a >= v) { say = `Even the low end (${ratio(a)}) is above ${ratio(v)}.`; tone = "good"; }
        else if (b != null && b < v) { say = `Even the high end (${ratio(b)}) is below ${ratio(v)}.`; tone = "bad"; }
        else { say = `The return is ${span([a, b], ratio)} per 1 ${cur}. Your value is inside this range.`; tone = "neutral"; }
      }
      const g = (D.groups || []).findIndex((x) => x.id === c.id);
      const colr = g >= 0 ? groupColor(D.groups[g], g) : COLORS[i];
      const left = a != null ? pos(a) : 0, right = b != null ? pos(b) : 100;
      const bar = el("div", { class: "bar", role: "img", "aria-label": `${c.label}: ${orders ? "cost per extra order" : "return"} ${span([a, b], orders ? money : ratio)}, your value ${orders ? money(v) : ratio(v)}` },
        el("div", { class: "fill", style: { left: left + "%", width: Math.max(1, right - left) + "%", background: colr, opacity: .35 } }),
        fin(m[orders ? "icpa" : "iroas"]) && real(c) ? el("div", { class: "pt", style: { left: pos(m[orders ? "icpa" : "iroas"]) + "%", background: colr } }) : null,
        el("div", { class: "mark", style: { left: pos(v) + "%" } }));
      return el("div", { class: "rangerow" },
        el("div", { class: "lab" }, el("i", { class: "swatch", style: { background: colr } }), c.label), bar,
        el("div", { class: "say" }, el("span", { class: "pill " + tone }, tone === "good" ? "✓ Pays off" : tone === "bad" ? "✗ Does not pay off" : "? Cannot tell"), " ", say));
    }));
  }
  input.addEventListener("input", draw);
  draw();
  return card("Is it worth the money?",
    orders ? "Move the slider to the most that you can pay for one extra order. The bars show each cost range." : "Move the slider to the return that you need to break even. The bars show each return range.",
    el("div", { class: "tool" }, el("label", { for: "worth" }, orders ? "The most you can pay for one extra order" : "The return you need per 1 " + cur), val, input), rows,
    el("p", { class: "tiny g" }, "The bar is the ", term("90% range", "range"), ". The dot is the best estimate. The black line is your value. ",

}

  const n = s.dates.length;
  const from = Math.max(0, s.n_pre - 56);

  const idx = [];

  const realName = holdout ? "Held-out markets (no ads)" : role === "crossover" ? "Real sales, both halves" : "Real sales";
  const twinName = holdout ? "Twin: the same markets with the ads" : role === "crossover" ? "Without the ads (estimate)" : "Twin: sales without the ads";
  const u = unitOf(D.kpi);
  function draw() {

    const ys = total ? idx.map((i) => i < s.n_pre ? 0 : gapAt[i]) : idx.flatMap((i) => [s.observed[i], s.counterfactual[i]]);
    const yMax = Math.max(1, ...ys.filter(fin)) * 1.1;
    const yMin = total ? Math.min(0, ...ys.filter(fin)) * 1.1 : 0;
    const x = (i) => ml + (W - ml - mr) * (i - from) / Math.max(1, n - 1 - from);
    const y = (v) => mt + (H - mt - mb) * (1 - (v - yMin) / (yMax - yMin || 1));
    const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": `${c.label}: ${total ? "running total of extra " + kpiWord(D.kpi) : realName + " and " + twinName}, by day` });
    // periods
    svg.append(sv("rect", { x: x(s.n_pre) - 0.5, y: mt - 6, width: Math.max(0, x(Math.min(end, n) - 1) - x(s.n_pre) + 1), height: H - mt - mb + 6, fill: "var(--band)" }));
    if (end < n) svg.append(sv("rect", { x: x(end) - 0.5, y: mt - 6, width: Math.max(0, x(n - 1) - x(end) + 1), height: H - mt - mb + 6, fill: "var(--band-2)" }));
    // grid + y axis
    const step = nice((yMax - yMin) / 4);

  const base = live.length ? live.sort((a, b) => a - b)[Math.floor(live.length / 2)] : 50;
  const lo = Math.min(base, ...live) / 4, hi = Math.max(base, ...live) * 4;
  const toV = (t) => snap(lo * Math.pow(hi / lo, t / 1000));
  const input = el("input", { type: "range", min: 0, max: 1000, value: Math.round(1000 * Math.log(base / lo) / Math.log(hi / lo)), id: "exp" });
  const val = el("div", { class: "val" });
  const holder = el("div", {});
  function draw() {
    const v = toV(Number(input.value));
    val.textContent = orders ? money(v) + " per extra order" : ratio(v);
    holder.replaceChildren(...all.map((d, k) => {
      const groups = [...d.shares.map((s, i) => ({ label: D.design === "crossover" ? "Half A" : D.labels[i] || "Cell " + (i + 1), share: s, n: d.n_cells[i], role: D.design === "crossover" ? "half" : "ads" })),
        { label: D.design === "crossover" ? "Half B" : D.design === "cells" ? "Control" : "No-ads holdout", share: fin(d.control_share) ? d.control_share : Math.max(0, 1 - d.shares.reduce((a, b) => a + b, 0)), n: d.n_control, role: D.design === "crossover" ? "half" : D.design === "cells" ? "control" : "holdout" }];
      const bar = el("div", { class: "share" }, groups.map((g, i) => el("div", { style: { flex: String(Math.max(g.share, 0.02)), background: groupColor(g, i) }, title: g.label }, g.share > 0.12 ? pct(g.share, 0) : "")));
      const legend = el("div", { class: "legend" }, groups.map((g, i) => el("span", {}, el("i", { class: "swatch", style: { background: groupColor(g, i) } }), `${g.label}: ${g.n} markets, ${pct(g.share, 0)}`)));
      const lengths = d.sensitivity.length ? d.sensitivity[0].curves.map((c) => c.test_days) : [];
      const table = d.sensitivity.length ? el("div", { class: "table-wrap" }, el("table", {},
        el("thead", {}, el("tr", {}, el("th", {}, "Test length"), ...d.sensitivity.map((s) => el("th", {}, s.label)))),
        el("tbody", {}, lengths.map((days, li) => el("tr", {}, el("td", {}, `${days / 7} weeks`), ...d.sensitivity.map((s) => {
          const c = s.curves[li];
          const effect = c.baseline_test_total ? (orders ? (s.budget / v) / c.baseline_test_total : (s.budget * v) / c.baseline_test_total) : null;
          const p = effect != null ? interp(c.points, effect) : null;
          return el("td", {}, `lift ${fin(c.mde) ? pct(c.mde) : "> 50%"}`, el("br"),
            p != null ? el("span", { class: "pill " + (p >= 0.8 ? "good" : p >= 0.5 ? "warn" : "bad") }, `${pct(p, 0)} chance`) : el("span", { class: "tiny" }, "not simulated"));
        })))))) : el("p", { class: "tiny" }, "Not simulated. FOSIT simulates only the top designs.");
      return card(`Design ${k + 1}${k === 0 ? " (best fit)" : ""}`, `Fit error ${d.fit.map((f) => pct(f)).join(", ")} · balance gap ${pct(d.balance_score)}`, bar, legend, table);
    }));
  }
  input.addEventListener("input", draw);
  draw();
  return [
    hero("Test options", `FOSIT found ${all.length} fair designs${D.fit_period === "week" ? ". Sales are small, so FOSIT judged fit on weekly totals" : ""}. Design 1 has the best fit.`, [DESIGN_NAME[D.design] || ""]),
    card("Will the test see it?", "Move the slider to the cost of one extra order that you expect. Each cell shows the chance that the test sees it. Aim for 80% or more.",
      el("div", { class: "tool" }, el("label", { for: "exp" }, orders ? "Expected cost per extra order" : "Expected return per 1 " + cur), val, input)),
    holder,
  ];
}

// ------------------------------------------------------------------ pages
function resultsPage() {
  const d = D.dates;
  return [
    hero("Test results", `${DESIGN_NAME[D.design] || ""}. Ads ran from ${pretty(d.test_start, true)} to ${pretty(d.test_end, true)}.`,
      [D.advertiser, D.interim ? "Early read" : "Final read", "Code " + (D.fingerprint || "").slice(0, 8).toUpperCase()].filter(Boolean)),
    answerCard(), worthCard(), ...anatomy("How this test works"), ...cellCards(), checksCard(), el("div", { class: "f" }, numbersCard()),
  ];
}
function planPage() {
  return [
    hero("Locked test plan", null, [D.advertiser, DESIGN_NAME[D.design], "Code " + (D.fingerprint || "").slice(0, 8).toUpperCase()].filter(Boolean)),
    el("section", { class: "card" }, el("h2", {}, "The plan in short"), el("p", {}, D.one_line),
      el("p", { class: "small muted" }, "The ", term("fingerprint", "fingerprint"), " ", el("span", { class: "mono" }, (D.fingerprint || "").slice(0, 8).toUpperCase()), " locks this plan. Send it to everyone before the test starts.")),
    ...anatomy("How this test works"), timelineCard(), sensitivityCard(), checklistCard(), marketsCard(), settingsCard(),
  ].filter(Boolean);
}
function main() {
  const app = document.getElementById("app");
  if (!D) { app.textContent = "No data in this file."; return; }
  const body = D.kind === "results" ? resultsPage() : D.kind === "designs" ? designsPage() : planPage();
  app.replaceChildren(header(), el("main", { class: "wrap" }, ...body, footer()));
  const saved = store.get("fosit-level");
  setLevel(["brief", "guided", "full"].includes(saved) ? saved : D.level || "guided");
}
main();
</script>
