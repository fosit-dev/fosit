name: validation-vs-geolift

on:
  push:
    paths: ["core/**", "validation/**", ".github/workflows/validation.yml"]
  pull_request:
    paths: ["core/**", "validation/**", ".github/workflows/validation.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned reference versions. Bump deliberately and record it in docs/CHANGELOG.md.
  GEOLIFT_REF: db34ea4299ff0e28515ebac502b78c076c93c905
  # augsynth as of GeoLift's last update (GeoLift db34ea4, 2026-04-01). Later augsynth (May 2026+) changed
  # summary() internals that GeoLift calls, and GeoLift crashes with them.
  AUGSYNTH_REF: 65c5a6f34f4e4a8b1011182fe12309ef022d992f

jobs:
  geolift:
    runs-on: ubuntu-24.04   # pinned: system library names differ across Ubuntu releases
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"   # bsts (GeoLift -> MarketMatching -> CausalImpact -> bsts) needs R >= 4.5
          use-public-rspm: true
      - name: System libraries for R packages
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev
      - name: Cache R library
        uses: actions/cache@v6
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r4.5-${{ runner.os }}-${{ env.GEOLIFT_REF }}-${{ env.AUGSYNTH_REF }}
      - name: Install GeoLift (reference only, never vendored)
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}   # remotes::install_github is rate-limited without a token
        run: |
          Rscript -e 'install.packages(c("remotes", "jsonlite"))'
          Rscript -e 'remotes::install_github("ebenmichael/augsynth", ref = Sys.getenv("AUGSYNTH_REF"), upgrade = "never")'
          Rscript -e 'remotes::install_github("facebookincubator/GeoLift", ref = Sys.getenv("GEOLIFT_REF"), upgrade = "never")'
      - name: Python dependencies
        run: pip install "numpy>=2.0" "scipy>=1.14" "pandas>=2.2"
      - name: Generate cases
        run: python validation/make_cases.py validation/cases
      - name: Run GeoLift
        run: Rscript validation/run_geolift.R validation/cases validation/out/geolift block
      - name: Compare
        run: python validation/compare.py validation/cases validation/out/geolift validation/out/report.md
      - name: Report in job summary
        if: always()
        run: cat validation/out/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation-report
          path: validation/out/
