    <!--
      Privacy by construction: the page may only talk to its own origin. No CDNs, no analytics,
      no fonts from elsewhere. 'wasm-unsafe-eval' lets the browser compile Pyodide's WebAssembly.
      The e2e privacy test (e2e/privacy.spec.ts) checks this from the outside too.
    -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'" />
    <meta name="referrer" content="no-referrer" />
